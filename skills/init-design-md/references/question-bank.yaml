- id: primary-color-vibe
  trigger: noPrimaryColor
  priority: 1
  question: 主色想传达什么气质？
  header: 主色气质
  defaultIndex: 0
  options:
    - label: 克制 / 中性 (recommended)
      description: slate / stone / warm gray 系，适合工具型产品
    - label: 鲜明 / 高饱和
      description: 品牌色驱动，适合消费者产品
    - label: 冷峻 / 企业
      description: 蓝 / 深灰系，适合 B2B / 后台
    - label: 我直接给 hex
      description: 选这个会让你输入具体色值

- id: typography-family
  trigger: noTypography
  priority: 2
  question: 排版用什么字体家族？
  header: 字体家族
  defaultIndex: 0
  options:
    - label: 几何无衬线 (recommended)
      description: Inter / Public Sans，现代通用
    - label: 人文无衬线
      description: Source Sans / IBM Plex，亲和耐读
    - label: 编辑衬线
      description: Fraunces / Newsreader，内容/品牌感强
    - label: 等宽 / 技术感
      description: JetBrains Mono，开发/数据工具

- id: accent-usage
  trigger: hasPrimaryColor
  priority: 3
  question: 强调色（accent）应该怎么用？
  header: 强调色用法
  defaultIndex: 0
  options:
    - label: 仅 CTA (recommended)
      description: 只用于最重要的操作按钮，保持克制
    - label: CTA + 激活态
      description: 用于操作按钮和选中/激活状态
    - label: 装饰 + CTA
      description: 也用于图标、链接、背景点缀
    - label: 边框 + 装饰
      description: 低饱和使用，几乎不用做背景

- id: density
  trigger: looksLikeDashboard
  priority: 4
  question: 界面密度倾向？
  header: 界面密度
  defaultIndex: 1
  options:
    - label: 紧凑 (recommended)
      description: 数据密集，减少留白，适合 dashboard/admin
    - label: 舒适
      description: 默认留白，通用
    - label: 宽松
      description: 大留白，营销/编辑风格

- id: corner-style
  trigger: hasTailwindTokens
  priority: 5
  question: 圆角风格？
  header: 圆角风格
  defaultIndex: 1
  options:
    - label: 锐利 (0-2px)
      description: 工程感 / 极简，适合工具
    - label: 柔和 (4-8px) (recommended)
      description: 现代通用，平衡
    - label: 圆润 (12-16px)
      description: 亲和 / 消费产品
    - label: 胶囊 (full)
      description: 高识别度，按钮/标签

- id: dark-mode
  trigger: mentionsDark
  priority: 6
  question: 需要暗色模式变体吗？
  header: 暗色模式
  defaultIndex: 1
  options:
    - label: 需要
      description: 提供深色等价 token（surface / on-surface）
    - label: 不需要 (recommended)
      description: 仅亮色，保持简单

- id: system-name
  trigger: always
  priority: 9
  question: 设计系统叫什么名字？
  header: 系统命名
  defaultIndex: 0
  options:
    - label: 沿用项目名 (recommended)
      description: 用 package.json 里的项目名作为 name
    - label: 我自定义
      description: 选这个会让你输入一个品牌名
